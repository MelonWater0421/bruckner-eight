<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bruckner 8 · 声音大教堂与复调导览 (Robert Haas / Günter Wand)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<audio id="audio" preload="metadata"></audio>
<header id="console" class="console">
 <div class="console-inner">
  <div class="console-top">
    <div class="brand">
      <div class="dg" style="border-color:#d9770666; background:#d9770619; color:#f59e0b;">
        <span style="font-weight:800; font-size:12px; letter-spacing:0.5px;">WAB</span>
        <small style="font-size:10px; font-weight:700;">108</small>
      </div>
      <div>
        <h1 id="consoleMovement">Bruckner 8 · Symphony in C minor</h1>
        <p>
          <span id="heroLength">Günter Wand · NDR / BPO</span>
          <span class="desktop-only" id="heroSubtitle"> · 罗伯特·哈斯版 · 四大乐章 · 复调雷达 · 四重对位</span>
        </p>
      </div>
    </div>
    <div class="utilities">
      <button id="langBtn" aria-label="Switch Language / 切换语言">English</button>
      <button data-action="settings" id="btnSettings">音源与校准</button>
      <button data-action="sources" id="btnSources">版本与资料</button>
      <button id="themeBtn" aria-label="切换主题">🌙 主题</button>
    </div>
  </div>
  <nav id="movementNav" aria-label="切换乐章"></nav>
  <div class="transport">
    <button id="prevMovement" aria-label="上一乐章">◀ 上一章</button>
    <button id="play" class="play" aria-label="播放">▶ 播放原声 / 模拟</button>
    <div class="nudge-group">
      <button id="back5" aria-label="后退五秒">−5s</button>
      <button id="forward5" aria-label="前进五秒">+5s</button>
    </div>
    <div class="clock"><b id="currentTime">00:00</b> / <span id="duration">00:00</span></div>
    <button id="nextMovement" aria-label="下一乐章">下一章 ▶</button>
    <button id="loop" aria-pressed="false">🔁 段落循环</button>
    <button id="follow" class="active" aria-pressed="true">📍 自动跟随</button>
    <button id="continuous" class="active" aria-pressed="true">⇥ 连续乐章</button>
    <label class="speed-label"><span class="sr-only">播放速度</span>
      <select id="speed" aria-label="播放速度">
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
      </select>
    </label>
    <button id="mute" aria-label="静音">♪</button>
  </div>
  <div class="wave-wrap" id="waveWrap">
    <canvas id="wave" aria-hidden="true"></canvas>
    <input id="scrub" type="range" min="0" max="1605" step="0.1" value="0" aria-label="播放位置">
    <span id="waveHover" class="wave-hover" hidden></span>
  </div>
  <div class="wave-meta">
    <span id="wavePosition">00:00</span>
    <span id="waveAct" class="quiet"></span>
    <div class="quick-jumps" id="quickJumps"></div>
  </div>
  <div class="telemetry">
    <div class="live-row">
      <span class="time-badge" id="liveTime">00:00</span>
      <h2 id="liveTitle">正在载入大教堂结构...</h2>
      <span class="sync-badge" id="syncBadge">● 对齐旺德版</span>
    </div>
    <div class="radar-card" id="radarCard" style="margin-top:8px;">
      <div class="radar-grid" id="radarGrid"></div>
    </div>
  </div>
 </div>
</header>

<main id="content">
  <!-- Dynamic content will be injected by app.js -->
</main>

<dialog id="dialog">
  <div class="dialog-head">
    <h2 id="dialogTitle">对话框</h2>
    <button id="dialogClose" aria-label="关闭">&times;</button>
  </div>
  <div id="dialogBody"></div>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="engine.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
